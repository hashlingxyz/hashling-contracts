[profile.default]
solc_version = "0.8.35"
evm_version = "osaka"
remappings = ["openzeppelin-contracts/=lib/openzeppelin-contracts/"]
optimizer = true
optimizer_runs = 200
fuzz = { runs = 5000 }
invariant = { runs = 512, depth = 100 }
src = "src"
out = "out"
libs = ["lib"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
